version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pb-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - pb-telemetry

  loki:
    image: grafana/loki:3.0.0
    container_name: pb-loki
    restart: unless-stopped
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - pb-telemetry

  promtail:
    image: grafana/promtail:3.0.0
    container_name: pb-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pb-telemetry

  grafana:
    image: grafana/grafana:10.4.1
    container_name: pb-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=change_this_strong_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - pb-telemetry

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: pb-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - pb-telemetry

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: pb-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    networks:
      - pb-telemetry

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  uptime_kuma_data:

networks:
  pb-telemetry:
    driver: bridge
