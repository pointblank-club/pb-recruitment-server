  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: pb-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - pb-telemetry

volumes:
  prometheus_data:

networks:
  pb-telemetry:
    driver: bridge
