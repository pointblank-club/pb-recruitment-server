name: Test, build and deploy the API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pb-recruitment-api
  ECS_CLUSTER: pb-recruitment
  ECS_SERVICE: pb-recruitment-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The ECS task definition pins the moving tag `main`; the commit tag is
      # kept so a rollback is one retag away. Forcing a new deployment pulls
      # `main` again. A deploy whose tasks never become healthy is rolled back
      # by ECS itself (deployment circuit breaker).
      - name: Build and push the image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:main" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:main"

      # Migrations run inside the VPC as a one-off ECS task (defined in
      # sih-infra): the API image just built supplies the migration files,
      # the official migrate image applies what is pending. The step fails
      # the deploy if a migration fails, before any new task starts.
      - name: Apply database migrations
        run: |
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")'); SG=$(echo "$NET" | jq -r '.securityGroups[0]')
          TASK=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition pb-recruitment-migrate --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migration task $TASK"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[?name==`migrate`].exitCode | [0]' --output text)
          ID=${TASK##*/}
          aws logs get-log-events --log-group-name /pb-recruitment/api --log-stream-name "migrate/migrate/$ID" \
            --query 'events[].message' --output text || true
          test "$CODE" = "0" || { echo "migrations failed (exit $CODE)"; exit 1; }

      - name: Deploy
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --query 'service.deployments[0].id' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[0].[rolloutState,rolloutStateReason]' --output text
